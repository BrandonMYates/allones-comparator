automation:
  methods:
    - method: agent
      models: ["claude-opus-5", "claude-fable-5.1"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Fable 5.1 (orchestrator) fixed the definitions and every lemma statement in advance,
        compiled the sorry'd skeleton, and dispatched three Claude Opus 5 agents in parallel, one
        Lean file each (basic degree/composition lemmas and the easy direction; trace lemmas over
        ZMod 2; the Artin–Schreier hard direction), each using sorry'd copies of the other files'
        interface lemmas. The orchestrator merged the files, removed the interface copies, assembled
        the main theorem, and ran the axiom audit. The informal proof was produced by GPT 6 Astra in
        Codex (OpenAI) and verified by hand and by three independent finite checkers before
        formalization.
      cost:
        wall_time: "about 12 minutes of parallel agent time per file plus roughly one hour of orchestration and merging (2026-09-11)"
        spend_usd: "subscription-based"
        hardware: "local machine (Apple silicon, 64 GB)"
      prompting_notes: >-
        Prompts gave exact target statements, the informal proof steps, candidate Mathlib lemma
        names to grep for, and forbade native_decide and new axioms.
  spend_usd: "subscription-based"
  notes: >-
    Fully agent-written Lean under human direction; the human author audited the Challenge
    statements against the OEIS comment and the TheoremDB record and reviewed the informal proof.

fidelity:
  divergences: "none known; the Challenge transcribes the OEIS comment and the TheoremDB statement directly, adding only the explicit n = 1 boundary theorem."

review:
  status: "self-assessed"
  reviewers:
