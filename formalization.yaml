  notes: >-
    Statement audit of Challenge.lean against OEIS A071642 and TheoremDB P12771 by the author.
    Mathematical review of the informal proof by Claude Fable 5.1, with three independent finite
    checkers (SymPy; two bit-polynomial Rabin tests) agreeing on n ≤ 129. Axiom audit by
    #print axioms on every compared declaration.

